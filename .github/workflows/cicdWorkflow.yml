# This is a workflow script for CI/CD

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Downloads repo code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Dependencies
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Run linter -> checks formatting issue
      - name: Lint
        run: yarn lint

      # # Run Test
      # - name: Run tests
      #   run: yarn test # to be changed

      # Build App
      - name: Build App
        run: yarn build
